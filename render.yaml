services:
  - type: web
    name: mission90-career-command-center
    region: singapore
    autoDeploy: false
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
