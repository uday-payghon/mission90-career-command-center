# Optional local PostgreSQL integration. Requires Docker Desktop.
# Export APP_PASSWORD before running docker compose up --build.
services:
  database:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: mission90
      POSTGRES_USER: mission90
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Supply a local-only database password}
    volumes:
      - mission90_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission90 -d mission90"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_USER: ${APP_USER:-uday}
      APP_PASSWORD: ${APP_PASSWORD:?Please export a unique APP_PASSWORD first}
      JDBC_DATABASE_URL: jdbc:postgresql://database:5432/mission90
      DB_USER: mission90
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Supply a local-only database password}
      SPRING_PROFILES_ACTIVE: dev
      COOKIE_SECURE: "false"
volumes:
  mission90_pgdata:
