spring.application.name=Job Mission
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/missiondb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=0
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
spring.jackson.serialization.write-dates-as-timestamps=false

spring.datasource.hikari.maximum-pool-size=3
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=4h
server.tomcat.max-http-form-post-size=32KB
spring.servlet.multipart.max-file-size=1KB
spring.servlet.multipart.max-request-size=1KB
