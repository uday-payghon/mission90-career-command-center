<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in · MISSION/90</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="color-scheme" content="dark"/>
<style>
  :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf3f7;background:#080f1b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(900px 600px at 80% 5%,#183724 0%,transparent 68%),#080f1b;padding:28px}
  main{width:min(100%,460px);background:#101e2b;border:1px solid #284054;border-radius:24px;padding:38px;box-shadow:0 32px 110px #0007}
  .logo{font-weight:900;letter-spacing:-1px;font-size:28px}.logo span{color:#caff62}.kicker{font-size:11px;letter-spacing:2px;font-weight:800;color:#caff62;margin-top:32px}
  h1{font-size:36px;letter-spacing:-1.5px;line-height:1.05;margin:12px 0}p{line-height:1.6;color:#96afbf;font-size:14px;margin-bottom:26px}
  label{display:block;color:#adbfce;font-size:11px;font-weight:800;letter-spacing:1px;margin:20px 0 9px}
  input{background:#091622;color:#eef7fa;border:1px solid #385264;border-radius:10px;padding:15px;width:100%;font-size:15px}
  input:focus{outline:2px solid #caff62;outline-offset:2px}
  button{margin-top:28px;width:100%;font-weight:800;color:#112015;background:#caff62;border:0;border-radius:10px;padding:16px;cursor:pointer}
  button:disabled{cursor:wait;opacity:.65}
  .notice{min-height:22px;color:#ffb4b4;margin-top:15px;font-size:13px}
  footer{margin-top:26px;border-top:1px solid #274051;padding-top:18px;font-size:12px;color:#829aac}
</style>
</head>
<body>
<main>
  <div class="logo">MISSION<span>/90</span></div>
  <div class="kicker">PRIVATE CAREER COMMAND CENTER</div>
  <h1>Welcome back,<br>future engineer.</h1>
  <p>Log in to safely access your saved tasks, DSA practice, study reflections and placement applications.</p>
  <form method="post" action="/login" id="loginForm">
    <label for="username">YOUR USERNAME</label>
    <input id="username" name="username" autocomplete="username" required autofocus/>
    <label for="password">PASSWORD</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required/>
    <input type="hidden" name="_csrf" id="csrf"/>
    <button id="submit" disabled>Preparing secure login…</button>
  </form>
  <div class="notice" id="notice" role="alert"></div>
  <footer>One day at a time. Your records are stored in your private database.</footer>
</main>
<script>
  const msg=document.getElementById('notice');
  if(new URLSearchParams(location.search).has('error'))msg.textContent='The username or password was incorrect.';
  if(new URLSearchParams(location.search).has('logout'))msg.textContent='You signed out successfully.';
  fetch('/api/csrf',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error('Login service unavailable');return r.json()}).then(j=>{
    document.getElementById('csrf').value=j.token;
    const button=document.getElementById('submit');button.disabled=false;button.textContent='SIGN IN SECURELY →';
  }).catch(()=>{msg.textContent='Cannot contact the secure login service. Reload the page to retry.'});
</script>
</body>
</html>
